name: ci
on: [push, pull_request]
permissions: { contents: read }
jobs:
  engine:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      TEST_PG_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e "./engine[dev]"
      - run: psql -h localhost -U postgres -c "create role engine login password 'engine'" 
      - run: python -m py_compile engine/scripts/provider_preflight.py engine/scripts/model_smoke_test.py engine/scripts/live_price_warmup.py
      - run: python engine/scripts/export_public_methodology.py --check
      - run: cd engine && pytest -q
        env: { TEST_PG_ENGINE_URL: "postgresql://engine:engine@localhost:5432/{db}" }
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: cd web && npm ci && npm run test:p0 && npm run typecheck && npm run test:secrets && npm run build && node scripts/smoke-public.mjs && node scripts/smoke-degraded.mjs
        env: { SITE_ACCESS: private, SITE_PASSWORD: ci }
      # Browser geometry of the real UI components, at phone and desktop sizes.
      # The fixture is auth-protected and available ONLY to this CI process.
      - name: Chrome responsive layout regression (375px / 1440px)
        run: |
          cd web
          npm install --no-save --package-lock=false playwright-core@1.56.1
          node scripts/verify-home-visual.mjs
        env: { SITE_ACCESS: private, SITE_PASSWORD: ci, AIL_UI_TEST_FIXTURE: "on" }
