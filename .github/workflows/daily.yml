# 미국 거래일 자동 실행. 실제 판단 시각 판정(휴장일·서머타임·08:00~09:15 ET 창)은 엔진이 한다.
# Local NY time handles DST. GitHub delivery is best-effort; the engine still enforces the cutoff and de-duplicates.
name: daily-engine
on:
  schedule:
    - cron: "12 8 * * 1-5"
      timezone: "America/New_York"
    - cron: "32 8 * * 1-5"
      timezone: "America/New_York"
    - cron: "52 8 * * 1-5"
      timezone: "America/New_York"
    - cron: "30 17 * * 1-5"
      timezone: "America/New_York"
  workflow_dispatch:
    inputs:
      job:
        description: "Engine command"
        required: true
        type: choice
        default: verify
        options: [verify, run-daily, run-settle, costs]
      scheduled_session:
        description: "Optional New York session date attached by the independent scheduler"
        required: false
        type: string
concurrency: { group: ail-engine, cancel-in-progress: false }
permissions: { contents: read }
jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      AIL_MODE: live
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      NHPLUG_APP_KEY: ${{ secrets.NHPLUG_APP_KEY }}
      NHPLUG_APP_SECRET: ${{ secrets.NHPLUG_APP_SECRET }}
      AIL_EXPERIMENT: ${{ vars.AIL_EXPERIMENT || 'season-1' }}
      AIL_START_SESSION: ${{ vars.AIL_START_SESSION }}
      AIL_MONTHLY_BUDGET_USD: ${{ vars.AIL_MONTHLY_BUDGET_USD || '10' }}
      AIL_MODEL_GPT: ${{ vars.AIL_MODEL_GPT || 'openai/gpt-4.1-mini' }}
      AIL_MODEL_CLAUDE: ${{ vars.AIL_MODEL_CLAUDE || 'anthropic/claude-sonnet-5.5' }}
      AIL_MODEL_GEMINI: ${{ vars.AIL_MODEL_GEMINI || 'google/gemini-3.8-flash' }}
      AIL_MODEL_DEEPSEEK: ${{ vars.AIL_MODEL_DEEPSEEK || 'deepseek/deepseek-v3.2' }}
    steps:
      - name: Explicit engine readiness gate
        shell: bash
        env:
          AIL_ENGINE_ENABLED: ${{ vars.AIL_ENGINE_ENABLED }}
        run: |
          set -euo pipefail
          if [[ "${AIL_ENGINE_ENABLED:-}" != "true" ]]; then
            echo "::error::Daily engine disabled. Set AIL_ENGINE_ENABLED=true in the production environment/repository."
            exit 1
          fi
          for key in DATABASE_URL OPENROUTER_API_KEY NHPLUG_APP_KEY NHPLUG_APP_SECRET; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::Required production secret ${key} is missing."
              exit 1
            fi
          done
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install ./engine
      - name: Run selected engine command
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL_JOB: ${{ inputs.job }}
          AIL_EXPECTED_SESSION: ${{ inputs.scheduled_session }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME:$SCHEDULE" in
            schedule:'30 17 * * 1-5') job=run-settle ;;
            schedule:'12 8 * * 1-5'|schedule:'32 8 * * 1-5'|schedule:'52 8 * * 1-5') job=run-daily ;;
            workflow_dispatch:*)
              case "$MANUAL_JOB" in verify|run-daily|run-settle|costs) job="$MANUAL_JOB" ;; *) exit 1 ;; esac ;;
            *) echo "::error::Unexpected daily-engine trigger"; exit 1 ;;
          esac
          ail "$job"
