# TEMPORARY: create the named branch at the passing TESTED_SHA first; then add
# only this workflow and engine/scripts/settlement_replay_helper.py in one commit.
# Replace 44f7ef821df1e9a1d73a6a9401a92594abf18438 everywhere after CI passes. Delete this
# branch after observing the bounded replay; do not merge these two files.
name: one-time-settlement-replay-20261126
on:
  push:
    branches: [ops/settlement-replay-20261126]
    paths:
      - .github/workflows/settlement-replay.yml
      - engine/scripts/settlement_replay_helper.py
permissions: { contents: read }
concurrency: { group: ail-engine, cancel-in-progress: false }
jobs:
  replay:
    if: >-
      ${{ github.repository == 'iskkang/ai-invest-lab' &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/ops/settlement-replay-20261126' &&
          github.run_attempt == '1' &&
          github.event.before == '44f7ef821df1e9a1d73a6a9401a92594abf18438' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      AIL_MODE: live
      AIL_ENGINE_ENABLED: ${{ vars.AIL_ENGINE_ENABLED }}
      AIL_EXPECTED_SESSION: '2026-11-25'
      AIL_TESTED_DIR: ${{ github.workspace }}/tested
      REPLAY_BEFORE: ${{ github.event.before }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      NHPLUG_APP_KEY: ${{ secrets.NHPLUG_APP_KEY }}
      NHPLUG_APP_SECRET: ${{ secrets.NHPLUG_APP_SECRET }}
      AIL_EXPERIMENT: ${{ vars.AIL_EXPERIMENT || 'season-1' }}
      AIL_START_SESSION: ${{ vars.AIL_START_SESSION }}
      AIL_MONTHLY_BUDGET_USD: ${{ vars.AIL_MONTHLY_BUDGET_USD || '10' }}
      AIL_MODEL_GPT: ${{ vars.AIL_MODEL_GPT || 'openai/gpt-4.1-mini' }}
      AIL_MODEL_CLAUDE: ${{ vars.AIL_MODEL_CLAUDE || 'anthropic/claude-sonnet-5.5' }}
      AIL_MODEL_GEMINI: ${{ vars.AIL_MODEL_GEMINI || 'google/gemini-3.8-flash' }}
      AIL_MODEL_DEEPSEEK: ${{ vars.AIL_MODEL_DEEPSEEK || 'deepseek/deepseek-v3.2' }}
    steps:
      - name: Production readiness and expiry gate
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${AIL_ENGINE_ENABLED:-}" != "true" ]]; then
            echo "::error::Production engine readiness gate is disabled."
            exit 1
          fi
          for key in DATABASE_URL OPENROUTER_API_KEY NHPLUG_APP_KEY NHPLUG_APP_SECRET; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::Required production secret ${key} is missing."
              exit 1
            fi
          done
          python3 - <<'PY'
          from datetime import datetime, timezone
          import sys
          expiry = datetime(2026, 11, 26, 6, 30, tzinfo=timezone.utc)
          if datetime.now(timezone.utc) >= expiry:
              print('::error::One-time settlement replay has expired.')
              sys.exit(1)
          PY
      - name: Check out replay helper
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: replay
          persist-credentials: false
      - name: Check out exact passing engine
        uses: actions/checkout@v4
        with:
          ref: 44f7ef821df1e9a1d73a6a9401a92594abf18438
          path: tested
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tested/engine/pyproject.toml
      - name: Install tested engine
        run: pip install ./tested/engine
      - name: Replay one closed session and record immutable-row evidence
        run: python replay/engine/scripts/settlement_replay_helper.py
