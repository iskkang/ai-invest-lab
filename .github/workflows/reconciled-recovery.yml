name: reconciled-settlement-recovery
on:
  push:
    branches: [ops/reconciled-recovery-20261126]
permissions: { contents: read }
concurrency: { group: ail-engine, cancel-in-progress: false }
jobs:
  recover:
    if: >-
      github.repository == 'iskkang/ai-invest-lab' &&
      github.event_name == 'push' &&
      github.event.before == 'c3463c40fffa64eecb0e8194142d10b2bbc7295c' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      AIL_MODE: live
      AIL_EXPERIMENT: season-1
      AIL_ENGINE_ENABLED: ${{ vars.AIL_ENGINE_ENABLED }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      NHPLUG_APP_KEY: ${{ secrets.NHPLUG_APP_KEY }}
      NHPLUG_APP_SECRET: ${{ secrets.NHPLUG_APP_SECRET }}
      AIL_MONTHLY_BUDGET_USD: ${{ vars.AIL_MONTHLY_BUDGET_USD || '10' }}
      AIL_MODEL_GPT: ${{ vars.AIL_MODEL_GPT || 'openai/gpt-4.1-mini' }}
      AIL_MODEL_CLAUDE: ${{ vars.AIL_MODEL_CLAUDE || 'anthropic/claude-sonnet-5.5' }}
      AIL_MODEL_GEMINI: ${{ vars.AIL_MODEL_GEMINI || 'google/gemini-3.8-flash' }}
      AIL_MODEL_DEEPSEEK: ${{ vars.AIL_MODEL_DEEPSEEK || 'deepseek/deepseek-v3.2' }}
      EXPECTED_SOURCE_SHA: c3463c40fffa64eecb0e8194142d10b2bbc7295c
      TESTED_SOURCE_PATH: ${{ github.workspace }}/tested-source
    steps:
      - uses: actions/checkout@v4
        with: { path: helper-source }
      - uses: actions/checkout@v4
        with:
          ref: c3463c40fffa64eecb0e8194142d10b2bbc7295c
          path: tested-source
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install exact tested engine
        run: pip install -e ./tested-source/engine
      - name: Migrate and verify the already closed session
        run: python helper-source/engine/scripts/reconciled_recovery_helper.py
