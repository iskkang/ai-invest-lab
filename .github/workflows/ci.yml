name: ci
on: [push, pull_request]
permissions: { contents: read }
jobs:
  engine:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      TEST_PG_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install "./engine[dev]"
      - run: psql -h localhost -U postgres -c "create role engine login password 'engine'" 
      - run: cd engine && pytest -q
        env: { TEST_PG_ENGINE_URL: "postgresql://engine:engine@localhost:5432/{db}" }
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: cd web && npm ci && npm run test:p0 && npm run typecheck && npm run test:secrets && npm run build
        env: { SITE_ACCESS: private, SITE_PASSWORD: ci }
